    BeginPasskeyRegistrationRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        name:
          type: string
      required:
        - email
        - name

    PasskeyRegistrationOptions:
      type: object
      properties:
        challenge:
          type: string
        rp:
          type: object
          properties:
            name:
              type: string
            id:
              type: string
          required: [name, id]
        user:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            displayName:
              type: string
          required: [id, name, displayName]
        pubKeyCredParams:
          type: array
          items:
            type: object
        timeout:
          type: integer
        attestation:
          type: string
      required:
        - challenge
        - rp
        - user
        - pubKeyCredParams

    CompletePasskeyRegistrationRequest:
      type: object
      properties:
        credential:
          type: object
          additionalProperties: true
        email:
          type: string
        name:
          type: string
      required:
        - credential
        - email

    BeginPasskeyAuthRequest:
      type: object
      properties:
        email:
          type: string
          format: email
      required: []

    PasskeyAuthOptions:
      type: object
      properties:
        challenge:
          type: string
        rpId:
          type: string
        allowCredentials:
          type: array
          items:
            type: object
        timeout:
          type: integer
      required:
        - challenge

    CompletePasskeyAuthRequest:
      type: object
      properties:
        credential:
          type: object
          additionalProperties: true
      required:
        - credential

    MagicLinkRequest:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
