    <!-- FAQ for AI assistants & rich results -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is EnviroIQ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "EnviroIQ is a multi-tenant ESG (Environmental, Social, Governance) sustainability platform purpose-built for New Zealand organisations. It provides real-time emissions tracking, audit-grade lineage on every metric, AI-assisted ESG advice, supplier audits, and board-grade PDF reports."
          }
        },
        {
          "@type": "Question",
          "name": "What makes EnviroIQ different from other ESG platforms?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Three things: (1) Audit-grade by design — every ESG number is traceable from source to output via an immutable audit log and versioned emission factors. (2) Real-time NZ data — direct integration with em6 grid intensity, Fuelsaver NZ, and fleet telematics. (3) Continuously verified compliance — a public live status widget proves operational security in real time."
          }
        },
        {
          "@type": "Question",
          "name": "Which standards and frameworks does EnviroIQ support?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "GHG Protocol (Scope 1, 2, 3), NZ Ministry for the Environment 2024 emission factors, Toitū CEMARS methodology, and NZ XRB climate-related disclosure requirements. Internal security aligned to SOC 2 Type II readiness, ISO 27001, NZ Privacy Act 2020, GDPR, and FIDO2/WebAuthn passwordless authentication."
          }
        },
        {
          "@type": "Question",
          "name": "How does EnviroIQ ensure data is audit-grade?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Every metric carries provenance: raw data, emission factor version, methodology, transformation chain, and the user who entered it — all linked in one click. The audit log is immutable; emission factors are versioned; calculations are reproducible against the historical factor at the time of recording."
          }
        },
        {
          "@type": "Question",
          "name": "Can EnviroIQ integrate with my CRM or other systems?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. EnviroIQ exposes a CRM Integration API aligned to the FGC Customer Operations API Standard v1, with a 19-path OpenAPI 3.1 specification covering customers, contacts, users, subscriptions, billing, provisioning, support tickets, and audit. It also ingests NZ em6 grid data, Fuelsaver NZ plate lookups, fleet GPS / telematics, energy meter feeds, and inbound utility-bill emails."
          }
        },
        {
          "@type": "Question",
          "name": "Is EnviroIQ secure?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Passwordless authentication (passkeys + magic links), per-tenant webhook secrets, hashed API keys with timing-safe comparison, tokenised public links, immutable audit logs, and HTTPS-only with strict CSP and HSTS. Operational status is continuously verified and published live at enviroiq.net — including a downloadable trust pack with SHA-256 checksum."
          }
        }
      ]
    }
